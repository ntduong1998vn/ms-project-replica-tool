name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test -- --run

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare Worker secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          umask 077
          test -n "$BETTER_AUTH_SECRET"
          printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET" > "$RUNNER_TEMP/wrangler-secrets"
      - run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/wrangler-secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove Worker secrets file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/wrangler-secrets"
